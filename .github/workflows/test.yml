name: Test

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: |
          sdkmanager "platforms;android-37"
          if [ ! -d "$ANDROID_HOME/platforms/android-37.0" ] && [ -d "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37 "$ANDROID_HOME/platforms/android-37.0"
          fi

      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}

      - name: Run JVM and Android host tests
        run: >
          ./gradlew
          :storage:jvmTest
          :wallet:jvmTest
          :wallet:testAndroidHostTest
          :shared:jvmTest
          --no-daemon
